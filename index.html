<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayoki Games</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg-color: #1e1e1e;
            --text-color: #e0e0e0;
            --highlight-color: #007bff;
            --highlight-hover: #0056b3;
            --shadow-color: rgba(0, 0, 0, 0.5);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        nav {
            background-color: var(--card-bg-color);
            padding: 10px 20px;
            box-shadow: 0 4px 6px var(--shadow-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .site-title {
            color: var(--highlight-color);
            font-weight: bold;
            text-decoration: none;
            font-size: 1.5em;
        }

        .nav-buttons a {
            color: var(--text-color);
            text-decoration: none;
            padding: 10px 15px;
            margin-left: 10px;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
        }

        .nav-buttons a:hover, .nav-buttons a.active {
            background-color: var(--highlight-color);
            color: white;
        }

        .intro-section {
            padding: 60px 20px;
            text-align: center;
            background-color: var(--card-bg-color);
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px var(--shadow-color);
        }

        .intro-section h1 {
            color: var(--highlight-color);
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .intro-section p {
            max-width: 700px;
            margin: 0 auto;
            font-size: 1.1em;
        }
    </style>
</head>

<body>

<nav>
    <a href="index.html" class="site-title">Ayoki Games</a>

    <div class="nav-buttons">
        <a href="index.html" class="active">Home</a>
        <a href="#games">Games</a>
        <a href="blog.html">Blog</a>
    </div>
</nav>

<div class="container">
    <header class="intro-section">
        <h1>Welcome to Ayoki Games</h1>
        <p>
            Welcome to ayoki games. This site has a crap ton of games and like sorry dvusd but like you wont block this site
        </p>
    </header>
</div>

</body>
</html>
