<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayoki Games</title>

<style>
:root{
  --bg:#121212;
  --card:#1e1e1e;
  --accent:#00aaff;
  --text:#e0e0e0;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial, sans-serif;
}

nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 20px;
  background:var(--card);
}

nav h1{
  margin:0;
  color:var(--accent);
}

#clock{
  font-size:14px;
  opacity:.8;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.search{
  display:flex;
  gap:10px;
  margin:20px 0;
}

.search input{
  flex:1;
  padding:10px;
  font-size:16px;
}

.search button{
  padding:10px 14px;
  cursor:pointer;
}

.game-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:15px;
}

.game{
  background:var(--card);
  border-radius:10px;
  overflow:hidden;
  text-decoration:none;
  color:white;
  transition:transform .2s;
}

.game:hover{
  transform:scale(1.05);
}

.game img{
  width:100%;
  height:120px;
  object-fit:cover;
}

.game span{
  display:block;
  padding:8px;
  text-align:center;
  font-size:14px;
}

mark{
  background:yellow;
  color:black;
}
</style>
</head>

<body>

<nav>
  <h1>Ayoki Games</h1>
  <div id="clock"></div>
</nav>

<div class="container">

<div class="search">
  <input id="search" placeholder="Search games...">
  <button onclick="clearSearch()">Clear</button>
</div>

<div id="count"></div>

<div class="game-grid" id="games">

<!-- GAME TEMPLATE -->
<a class="game" href="games/eggycar.html">
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSjiN2Nchwat1tZFqTnAz3ZPQ8GYK9JSfAXmA&s">
  <span>Eggy Car</span>
</a>

<a class="game" href="games/run3.html">
  <img src="https://upload.wikimedia.org/wikipedia/en/5/5c/Run_3_game_icon.png">
  <span>Run 3</span>
</a>

<a class="game" href="games/slope.html">
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQXqV1Hj1q5nWcL2D5LZ8_kR0Z5N6XcI5q1xQ&s">
  <span>Slope</span>
</a>

<a class="game" href="games/retrobowl.html">
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcShZ9TzS1n8oVx6aZK9HT5W5GQhWQpRxwH7bQ&s">
  <span>Retro Bowl</span>
</a>

</div>
</div>

<script>
// CLOCK
function updateClock(){
  document.getElementById("clock").textContent =
    new Date().toLocaleTimeString();
}
setInterval(updateClock,1000);
updateClock();

// SEARCH
const search = document.getElementById("search");
const games = [...document.querySelectorAll(".game")];
const count = document.getElementById("count");

games.forEach(g=>{
  g.dataset.name = g.innerText.toLowerCase();
});

function filter(){
  let visible = 0;
  games.forEach(g=>{
    if(g.dataset.name.includes(search.value.toLowerCase())){
      g.style.display="";
      visible++;
    }else{
      g.style.display="none";
    }
  });
  count.textContent = `${visible} games`;
}

function clearSearch(){
  search.value="";
  filter();
}

search.addEventListener("input",filter);
count.textContent = `${games.length} games`;
</script>

</body>
</html>
